# cargo-about settings for scripts/gen-notices.mjs, which builds the
# "Rust crates" group of Help → Third-party Notices.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys, zip's Rust port of bzip2; the C bzip2 it replaced had the same license.
    "bzip2-1.0.6",
]
# Only what's linked into the app: build scripts and dev-only crates don't ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true
