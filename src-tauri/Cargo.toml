[package]
name = "glasshouse"
version = "0.2.0"
description = "Desktop file manager for Windows and Linux"
authors = ["Anthony Johnson"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "glasshouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Debug builds always have the webview inspector. This turns it on in a
# release build too, for debugging one: pnpm tauri build --no-bundle --features devtools
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# build.rs reads permissions/*.toml to check them against the registered commands.
toml = "0.9"

[dependencies]
# 2.11.1 fixes GHSA-7gmj-67g7-phm9 (remote pages reaching local-only IPC).
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.2"
# Only its open_path and open_url functions; the plugin itself isn't
# registered, because the frontend never calls it.
tauri-plugin-opener = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# git2's C bindings, already in the lock file through it: checkout's
# exact-path flag, which git2 0.19 doesn't expose (commands/git.rs).
libgit2-sys = "0.17"
sysinfo = "0.32"
notify = "7"
notify-debouncer-full = "0.4"
dunce = "1"
which = "6"
trash = "5"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
regex = "1"
# 9.0.5 fixes GHSA-m665-v7pm-7grj and the other zip 2.x advisories.
zip = "9.0.5"
# Same features as zip's own zstd dependency, so nothing extra gets built.
zstd = { version = "0.14", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
base64 = "0.22"
similar = "2"
portable-pty = "0.9"
tauri-plugin-window-state = "2.5"
# The log file in the app's log folder (Help → Open Log Folder), for what
# went wrong: stderr goes nowhere in a Windows release build.
tauri-plugin-log = "2.10"
log = "0.4"
# Already in the lock file through tauri-plugin-log, with these features: the
# log's timestamps (diagnostics.rs).
time = { version = "0.3", features = ["formatting", "macros"] }
# Already in the lock file through tauri: file:// URIs on the command line
# (startup.rs) and in the FileManager1 calls.
url = "2"
# Already in the lock file through tauri, which finds its app folders with
# it: migrate.rs finds the same ones.
dirs = "7"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Diagnostics_Debug",
    # ShellExecuteExW with a class (open_with "Text Editor (.txt)").
    "Win32_System_Registry",
    # MessageBoxW: the box when glasshouse can't start or has crashed (fatal.rs).
    "Win32_UI_WindowsAndMessaging",
    # A second launch's handoff pipe and its same-user check (handoff/pipe.rs).
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    # The clipboard (commands/clipboard/win32.rs): CF_HDROP and text, and
    # OLE's data object to tell a cut's source its paste succeeded.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Gdi",
] }

# Dragging files out on Windows: OLE DoDragDrop with CF_HDROP
# (commands/drag_out.rs), as tauri-plugin-drag does.
[target.'cfg(windows)'.dependencies.drag]
version = "2.1"

# Already in the lock file through tauri-plugin-opener; the FileManager1
# reveal call and the resident D-Bus mode (resident.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Already in the lock file through several dependencies; the file chooser
# backend's wait for its window process (portal.rs).
futures-channel = "0.3"
# Already in the lock file through tauri (same version); the drag source for
# dragging files out (commands/drag_out.rs).
gtk = "0.18"

# Already in the lock file through several dependencies; used for renameat2
# (Linux) and to kill a timed-out script's process group (proc_tree.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
