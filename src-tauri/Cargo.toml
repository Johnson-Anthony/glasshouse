[package]
name = "glasshouse"
version = "0.2.0"
description = "Desktop file manager for Windows and Linux"
authors = ["Anthony Johnson"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "glasshouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Debug builds always have the webview inspector. This turns it on in a
# release build too, for debugging one: pnpm tauri build --no-bundle --features devtools
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# build.rs reads permissions/*.toml to check them against the registered commands.
toml = "0.9"

[dependencies]
# 2.11.1 fixes GHSA-7gmj-67g7-phm9 (remote pages reaching local-only IPC).
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-opener = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-shell = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
sysinfo = "0.32"
notify = "7"
notify-debouncer-full = "0.4"
dunce = "1"
which = "6"
trash = "5"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
regex = "1"
# 9.0.5 fixes GHSA-m665-v7pm-7grj and the other zip 2.x advisories.
zip = "9.0.5"
# Same features as zip's own zstd dependency, so nothing extra gets built.
zstd = { version = "0.14", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
base64 = "0.22"
similar = "2"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
] }

# Both already come in through tauri-plugin-opener; used for the
# FileManager1.ShowItems reveal call.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
url = "2"

# Already in the lock file through several dependencies; used for renameat2
# (Linux) and to kill a timed-out script's process group (proc_tree.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
