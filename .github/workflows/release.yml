name: release

# Builds the installers for a version tag and publishes them as one release.
#
# Push a tag such as v0.2.0. Before that, package.json, src-tauri/Cargo.toml,
# src-tauri/tauri.conf.json and src-tauri/Cargo.lock must all have that
# version, and CHANGELOG.md must have a dated section for it, which becomes
# the release notes (scripts/release-check.mjs). A manual run must also be
# started from the tag ("Use workflow from" → Tags).
#
# Every build uploads to one draft release. It becomes public only after
# every build has passed and all eight files are on it; the publish job
# adds SHA256SUMS and a provenance attestation for them first. If a build
# fails, the draft stays for a re-run, and nothing is published.
#
# Updates (src-tauri/src/update.rs): each build signs its packages for the
# app's updater, with the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the minisign key whose public half is
# plugins.updater.pubkey in tauri.conf.json). The prepare job stops the run
# if either is missing or the key doesn't match that public key. The publish
# job checks every package's signature and writes latest.json, which the
# app's update check reads from the latest release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Require a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Run the release for a v* tag, not the $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
          exit 1

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Check the versions and the changelog
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile

      # Before the builds: a release whose packages aren't signed with the
      # key the app trusts would break every user's update check.
      - name: Check the update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret isn't set (Settings → Secrets and variables → Actions). Releases sign their packages for the updater; see \"Updates\" in docs/ARCHITECTURE.md. A fork needs its own key pair, with its public key and its own endpoint in tauri.conf.json (plugins.updater)."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          v=${GITHUB_REF_NAME#v}
          printf 'glasshouse %s signing probe\n' "$v" > "$RUNNER_TEMP/probe.txt"
          if ! pnpm tauri signer sign --app-version "$v" "$RUNNER_TEMP/probe.txt" > /dev/null; then
            echo "::error::Signing with TAURI_SIGNING_PRIVATE_KEY failed: check the key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          if ! node scripts/updater-json.mjs verify "$RUNNER_TEMP/probe.txt" "$RUNNER_TEMP/probe.txt.sig" "$v"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't the key whose public half is plugins.updater.pubkey in tauri.conf.json, so installed copies would refuse its updates."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - name: Check that Cargo.lock is current
        run: cargo fetch --locked
        working-directory: src-tauri

      - name: Add the install notes
        run: |
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ## Install

          - **Windows (x64 and arm64):** the `-setup.exe` installs for you alone, with no admin rights: it's the one to pick. The `.msi` installs for every user of the PC, for IT deployment. They aren't signed, so SmartScreen warns the first time: choose More info → Run anyway.
          - **Linux (x64 and arm64):** the `.deb` (`sudo apt install ./glasshouse_*.deb`) or the `.AppImage` (`chmod +x`, then run it). The AppImage needs FUSE 2: `sudo apt install libfuse2t64` on Ubuntu 24.04+ and Debian 13, `libfuse2` on older releases. Both need glibc 2.35 or newer (Ubuntu 22.04, Debian 12 and later).
          - **Checking a download:** `SHA256SUMS` has each file's SHA-256 (`sha256sum -c SHA256SUMS --ignore-missing`). `gh attestation verify <file> --repo Johnson-Anthony/glasshouse` checks that this repository's release workflow built it.
          EOF

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run reuses this tag's draft. A published release is never
          # touched: fix it by hand, or release a new version.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"' | head -n 1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::The $TAG release is already published."
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f name="glasshouse $TAG" -F body=@"$RUNNER_TEMP/notes.md" > /dev/null
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="glasshouse $TAG" -F body=@"$RUNNER_TEMP/notes.md" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          # Native arm64: the x64 build runs on Windows on Arm only emulated.
          - os: windows-11-arm
            args: ""
          # Linux packages are built on the oldest Ubuntu with WebKitGTK 4.1,
          # so they run on glibc 2.35 and newer (Ubuntu 22.04, Debian 12).
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
          # linuxdeploy can't cross-build an AppImage, so arm64 needs an arm64 runner.
          - os: ubuntu-22.04-arm
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Uploads to the draft. The file names come from the Tauri CLI and
      # include the architecture, so the jobs never replace each other's files.
      # release.conf.json turns on createUpdaterArtifacts, so each package
      # gets a .sig, uploaded beside it (CI's own builds stay unsigned).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # The publish job writes latest.json once every build is on the
          # draft: the action's own rewrites it in each job, and four jobs
          # finishing together can drop each other's entries.
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/release.conf.json

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The provenance attestation: a signed statement, kept by GitHub, that
      # this workflow run built the files.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      # The package list, the changelog section and the updater's public key.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the files and write SHA256SUMS
        run: |
          v=${TAG#v}
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
            --jq '.[] | "\(.id) \(.name)"' > "$RUNNER_TEMP/assets.txt"
          echo "On the draft:"
          cat "$RUNNER_TEMP/assets.txt"
          mkdir -p "$RUNNER_TEMP/files" "$RUNNER_TEMP/sigs"
          missing=0
          while read -r want; do
            for name in "$want" "$want.sig"; do
              asset=$(awk -v n="$name" '$2 == n { print $1 }' "$RUNNER_TEMP/assets.txt")
              if [ -z "$asset" ]; then
                echo "::error::$name isn't on the draft release; it stays a draft."
                missing=1
                continue
              fi
              dir=files
              [ "$name" = "$want" ] || dir=sigs
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/$dir/$name"
            done
          done < <(node scripts/updater-json.mjs files "$v")
          [ "$missing" = 0 ] || exit 1
          cd "$RUNNER_TEMP/files"
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"

      # Every package's signature must check out against the app's public
      # key, for this version, or the release stays a draft.
      - name: Check the signatures and write latest.json
        run: |
          node scripts/release-check.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP"/sigs/*.sig "$RUNNER_TEMP/files/"
          node scripts/updater-json.mjs write "$TAG" "$RUNNER_TEMP/files" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/latest.json"
          rm "$RUNNER_TEMP"/files/*.sig

      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS

      - name: Add SHA256SUMS and latest.json, and publish the release
        run: |
          upload() {
            # A re-run replaces the one an earlier run added.
            old=$(awk -v n="$1" '$2 == n { print $1 }' "$RUNNER_TEMP/assets.txt")
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            fi
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$RUNNER_TEMP/$1" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$1" > /dev/null
          }
          upload SHA256SUMS text/plain
          upload latest.json application/json
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
            -F draft=false -f make_latest=true --jq .html_url
