# The field ids (version, install, os, desktop) are stable: Help → Report Bug…
# can fill them in through the new-issue URL's query string.
name: Bug report
description: Something doesn't work, or works differently from what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't use this form: see [SECURITY.md](https://github.com/Johnson-Anthony/glasshouse/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: glasshouse version
      description: Help → About shows it.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - setup.exe (Windows)
        - MSI (Windows)
        - .deb (Linux)
        - AppImage (Linux)
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: "The OS and its version, and x64 or Arm. On Windows, `winver` shows the version; on Linux, `cat /etc/os-release` and `uname -m`."
      placeholder: "Windows 11 24H2 x64, or Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and session (Linux)
      description: "`echo $XDG_CURRENT_DESKTOP $XDG_SESSION_TYPE` shows them, and the scaling if it isn't 100%. Leave it empty on Windows."
      placeholder: "GNOME wayland, 125%"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line, starting from opening glasshouse.
      placeholder: |
        1. Open a folder with …
        2. Right-click … and choose …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error message word for word, if there was one. Screenshots help; you can paste them here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything else
      description: Other apps involved (for drag and drop, "Show in folder" or open and save dialogs), whether it happens every time, and output from starting glasshouse in a terminal.
